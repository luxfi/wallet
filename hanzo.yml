# Hanzo CI/CD for luxfi/wallet: .github/workflows/cicd.yml imports hanzoai/ci,
# which reads this file. The build door builds each image, one BuildKit Job
# per platform.
images:
  - name: wallet-web
    context: .
    dockerfile: apps/web/Dockerfile
    repo: ghcr.io/luxfi/wallet-web
    platforms: [linux/amd64]
