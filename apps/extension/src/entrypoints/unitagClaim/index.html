<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preload" href="assets/fonts/Zen-Variable.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    html,
    body,
    #unitag-claim-root {
      min-height: 100%;
    }

    * {
      font-family: 'Zen', sans-serif;
      box-sizing: border-box;
    }

    /**
          Zen is one variable file for the whole 100-900 range, loaded from public/
          so it does not block LCP's critical path.
        */
    @font-face {
      font-family: 'Zen';
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
      src:
        url(assets/fonts/Zen-Variable.woff2) format('woff2');
    }

    html {
      font-variant: none;
      font-smooth: always;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <title>Lux Extension</title>
</head>

<body>
  <div id="unitag-claim-root"></div>
  <script type="module" src="main.tsx"></script>
</body>

</html>
